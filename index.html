body::before{content:"";position:fixed;inset:0;background:var(--ov);z-index:-1}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:2px solid var(--g);display:flex;align-items:center;gap:12px;padding:8px 14px;flex-wrap:wrap}
header img.main{height:46px}
nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
nav a,.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;text-decoration:none;font-size:15px}
nav a.o,.btn.o{background:transparent;color:var(--g);border:1.5px solid var(--g)}
.btn.r{background:#b3261e}.btn.s{padding:4px 10px;font-size:13px}
main{max-width:1000px;margin:0 auto;padding:18px 14px 40px}
.hero{text-align:center;padding:26px 10px}
.hero h1{font-size:clamp(30px,7vw,52px);margin:0;color:var(--g)}
.hero p{color:var(--mu);margin:6px 0 0;font-size:18px}
.q{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:16px 0}
.q blockquote{margin:0;padding:12px 16px;background:var(--card);border-left:5px solid var(--ac);border-radius:6px;font-size:17px}
h2{border-bottom:3px solid var(--ac);display:inline-block;padding-bottom:2px;margin:26px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card .e{font-size:44px;text-align:center}.card img.pi{width:100%;height:150px;object-fit:cover;border-radius:8px}
.card b{font-size:18px}.p{color:var(--ac);font-weight:700;font-size:18px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin:12px 0}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);width:100%}
label{display:block;margin:8px 0 2px;font-size:14px;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
.wrap{overflow-x:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:120px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
footer{background:var(--card);border-top:2px solid var(--g);padding:16px;text-align:center}
footer .lg{display:flex;gap:18px;justify-content:center;align-items:center;flex-wrap:wrap;margin:8px 0}
footer img{height:44px;max-width:150px;object-fit:contain}
.st{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--bd);font-size:13px}
.big{font-size:24px;font-weight:700;color:var(--g)}.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:20;max-width:90%}
#gd{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}.gb{background:var(--card);border-radius:14px;padding:22px;max-width:420px;width:100%;text-align:center}.ge{font-size:72px;animation:pop .6s}.sub{min-height:76px;color:var(--mu);font-size:17px}.dots{display:flex;gap:6px;justify-content:center;margin:8px 0}.dots i{width:8px;height:8px;border-radius:50%;background:var(--bd)}.dots i.on{background:var(--g)}.gp{height:4px;background:var(--bd);margin:8px 0 12px;border-radius:2px;overflow:hidden}.gp span{display:block;height:100%;background:var(--g);animation:fill 6s linear forwards}@keyframes fill{from{width:0}to{width:100%}}@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.adm-link{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:9px 22px;border-radius:999px;background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;text-decoration:none;font-weight:600;font-size:15px;box-shadow:0 3px 10px rgba(0,0,0,.2);transition:transform .15s,box-shadow .15s}.adm-link:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.28)}.credit{margin-top:14px;padding-top:8px;border-top:1px solid var(--bd);font-size:11px;color:var(--mu);letter-spacing:.3px}.credit b{color:var(--tx)}

function shrink(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.75))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(f)})}
